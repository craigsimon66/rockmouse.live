<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debate Coach | RockMouse Labs AI Agents</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#0a4a4a;--teal:#0d7b7b;--teal-l:#e6f4f4;
  --bg:#f5f7f5;--white:#fff;--text:#1a2e2e;--muted:#5a7070;
  --border:#c8dede;--font:'DM Sans',system-ui,sans-serif;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;}
.hdr{background:var(--navy);padding:12px 20px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}
.hdr img{height:28px;width:auto;}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;}
.hdr-label{font-size:10px;color:rgba(255,255,255,0.55);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;}
.hdr-name{font-size:13px;color:rgba(255,255,255,0.9);font-weight:600;}
.chat-wrap{flex:1;display:flex;flex-direction:column;width:100%;overflow:hidden;}
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;}
.msg{display:flex;gap:10px;align-items:flex-start;}
.msg.user{flex-direction:row-reverse;}
.msg-av{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.msg.ai .msg-av{background:var(--navy);color:#fff;}
.msg.user .msg-av{background:var(--teal);color:#fff;}
.bubble{max-width:80%;padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.65;}
.msg.ai .bubble{background:var(--white);border:1px solid var(--border);border-top-left-radius:3px;}
.msg.user .bubble{background:var(--navy);color:#fff;border-top-right-radius:3px;}
.bubble strong{font-weight:700;} .bubble em{font-style:italic;}
.bubble ol{padding-left:1.2rem;margin:6px 0;} .bubble li{margin-bottom:4px;}
.typing-dots span{display:inline-block;width:7px;height:7px;background:var(--teal);border-radius:50%;margin:0 2px;animation:bounce 1.2s infinite;}
.typing-dots span:nth-child(2){animation-delay:.2s;} .typing-dots span:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
.input-area{border-top:1px solid var(--border);padding:14px 20px;background:var(--white);flex-shrink:0;}
.input-row{display:flex;gap:8px;align-items:flex-end;}
.chat-input{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:10px 14px;font-size:14px;font-family:var(--font);resize:none;outline:none;min-height:44px;max-height:120px;transition:border-color 0.15s;}
.chat-input:focus{border-color:var(--teal);} .chat-input:disabled{opacity:0.5;}
.btn-send{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:0 18px;height:44px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);white-space:nowrap;transition:background 0.15s;flex-shrink:0;}
.btn-send:hover{background:var(--navy);} .btn-send:disabled{background:var(--muted);cursor:not-allowed;}
.input-hint{font-size:11px;color:var(--muted);text-align:center;margin-top:6px;}
</style>
</head>
<body>
<div class="hdr">
  <div style="display:flex;align-items:center;gap:12px;">
    <img src="https://rockmouse.live/assets/rockmouse-logo-wide.svg" alt="RockMouse Labs" onerror="this.style.display='none'" style="height:28px;width:auto;filter:brightness(0) invert(1);">
    <span style="border-left:1px solid rgba(255,255,255,0.35);padding-left:12px;font-size:13px;color:#ffffff;font-weight:600;">Debate Coach</span>
  </div>
</div>
<div class="chat-wrap">
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <div class="input-row">
      <textarea class="chat-input" id="inp" rows="1" placeholder="Type your response here…"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"
        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
      <button class="btn-send" id="btn-send" onclick="send()">Send &#9654;</button>
    </div>
    <div class="input-hint">Enter to send &middot; Shift+Enter for new line</div>
  </div>
</div>
<script>
const PROXY='/api/messages';
const TOKEN='EvcEETnK9mTErZ90CGguBccMdq2EbCV742tu5Gz4';
const MODEL='claude-sonnet-4-6';
const SYSTEM=`You are the RockMouse Labs Debate Coach, a rigorous, intellectually sharp AI sparring partner built to help professionals develop the skill of constructive challenge.

Your role: When the user states a position on a workplace dilemma, you immediately argue the counter-position with intellectual rigour. You surface the weaknesses in their argument, ask the questions they haven't considered, and push back on assumptions — all while maintaining professional respect.

How you work:
- Open by presenting 4 workplace dilemmas the user can choose from, OR invite them to state their own.
— Once they choose and state their position, switch into debate mode. Argue the opposing view clearly and specifically. Be sharp — this is not gentle.
— After 2–3 exchanges, automatically shift to Debrief Mode. Signal this clearly: "Let's step out of the debate for a moment."
— In the debrief: acknowledge what was strong in their argument, name the reasoning patterns you observed (strengths and blind spots), and give them 3 practical tactics for constructive challenge in a real workplace without damaging relationships.

The 4 dilemmas to offer at the start:
1. "Launch now vs. wait until testing is complete" — Your team wants to launch a new customer process next month even though testing isn't complete.
2. "Customer speed vs. compliance rigour" — A senior leader wants to fast-track a customer approval to hit quarterly targets, skipping a standard compliance check.
3. "Team harmony vs. honest feedback" — Your rotation manager asks for your honest view of a major project. You think it has serious flaws. The whole team is proud of it.
4. "Budget reallocation" — You believe the team's budget should be redirected to a higher-impact initiative, but doing so would deprioritise your own manager's pet project.

Tone: sharp and intellectually demanding, but never cruel. The goal is to build their muscle — not deflate them. Keep responses under 200 words in debate mode; the debrief can be longer.`;
const WELCOME="Welcome to the Debate Coach. This is your space to sharpen the skill of constructive challenge — one of the most valuable and underused capabilities in any organisation.\n\nHere's how it works: you choose a dilemma, state your position, and I'll argue the opposing view. After we've sparred a few rounds, I'll debrief on what I noticed in your reasoning.\n\nChoose a dilemma to begin — or describe your own:\n\n**1.** Launch now vs. wait: Your team wants to ship a new customer process before testing is complete.\n**2.** Speed vs. compliance: A senior leader wants to fast-track an approval, skipping a standard compliance step.\n**3.** Honesty vs. team harmony: Your manager asks for your honest view of a project the whole team is proud of — but you think it has real flaws.\n**4.** Budget reallocation: You believe the team's budget would deliver more impact elsewhere — including deprioritising your own manager's project.\n\nWhich one — or what's yours?";
let history=[],loading=false;
function md(t){
  if(!t)return'';
  t=t.replace(/\\n/g,'\n');
  let h=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/\*(.+?)\*/g,'<em>$1</em>');
  h=h.replace(/^(\d+)\. (.+)$/gm,'<li>$2</li>');
  h=h.replace(/(<li>[\s\S]*?<\/li>)/g,'<ol>$1</ol>');
  h=h.replace(/\n\n/g,'</p><p>');
  h='<p>'+h+'</p>';
  h=h.replace(/<p><\/p>/g,'').replace(/\n/g,'<br>');
  return h;
}
function addMsg(role,text){
  const w=document.getElementById('messages');
  const d=document.createElement('div');d.className='msg '+role;
  const av=document.createElement('div');av.className='msg-av';av.textContent=role==='user'?'You':'DC';
  const b=document.createElement('div');b.className='bubble';
  if(role==='user'){b.textContent=text;}else{b.innerHTML=md(text);}
  d.appendChild(av);d.appendChild(b);w.appendChild(d);w.scrollTop=w.scrollHeight;return b;
}
function showTyping(){
  const w=document.getElementById('messages');
  const d=document.createElement('div');d.className='msg ai';d.id='typing';
  d.innerHTML='<div class="msg-av">DC</div><div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
  w.appendChild(d);w.scrollTop=w.scrollHeight;
}
function hideTyping(){const e=document.getElementById('typing');if(e)e.remove();}
async function send(){
  const inp=document.getElementById('inp');
  const text=inp.value.trim();
  if(!text||loading)return;
  inp.value='';inp.style.height='auto';
  addMsg('user',text);
  history.push({role:'user',content:text});
  loading=true;
  document.getElementById('btn-send').disabled=true;inp.disabled=true;
  showTyping();
  try{
    const res=await fetch(PROXY,{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},
      body:JSON.stringify({model:MODEL,max_tokens:1024,system:SYSTEM,messages:history})
    });
    if(!res.ok)throw new Error('API error '+res.status);
    const data=await res.json();
    const reply=(data.content?.find(b=>b.type==='text')||{}).text||'';
    hideTyping();history.push({role:'assistant',content:reply});addMsg('ai',reply);
  }catch(e){hideTyping();addMsg('ai','Something went wrong — please try again.');}
  loading=false;document.getElementById('btn-send').disabled=false;inp.disabled=false;inp.focus();
}
window.addEventListener('DOMContentLoaded',()=>{
  const w=WELCOME.replace(/\\n/g,'\n');
  addMsg('ai',w);history.push({role:'assistant',content:w});
  document.getElementById('inp').focus();
});
</script>
</body>
</html>
